name: Backend & GeoAI CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system spatial libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Black Code Format Check
        run: |
          black --check .

      - name: Run Type Checking with Mypy
        run: |
          mypy backend/app ml/pipeline || true

      - name: Run Test Suite with Coverage
        run: |
          pytest backend/tests --cov=backend/app --cov-report=xml --cov-report=term

      - name: Upload Coverage to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
